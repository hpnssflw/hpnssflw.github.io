# Applies to every topic unless overridden in that topic's own file.
max_age_days: 10
min_relevance: 6 # 1-10 scale
max_items: 8
attention:
  enabled: true
  min_score_gain: 50

llm:
  base_url: https://api.deepseek.com
  # deepseek-chat was discontinued 2026-07-24; deepseek-v4-flash is its
  # replacement (the non-thinking mode deepseek-chat used to point to).
  model: deepseek-v4-flash

delivery:
  telegram_channel: "@REPLACE_ME" # the channel's public handle; not a secret. Set once the bot/channel exist (see agent/deliver.py's TODO).
  delivery_cadence_hours: 24 # digest rollup cadence; collection/ranking run every 4h regardless
